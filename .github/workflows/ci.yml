name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake and system dependencies
        run: |
          sdkmanager --install "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache speech runtime and models
        uses: actions/cache@v4
        with:
          path: voice
          key: voice-${{ hashFiles('scripts/fetch-voice-assets.sh') }}

      # unit tests, debug build, and the check that network use stays limited to model downloads
      - name: Check
        run: ./scripts/check.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: local-voice-ime-debug
          path: app/build/outputs/apk/debug/*.apk
