name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. Features that need network access are out of scope.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
