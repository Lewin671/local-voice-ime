name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. Features that send audio or text anywhere are out of scope; the app only goes online to download speech models.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
