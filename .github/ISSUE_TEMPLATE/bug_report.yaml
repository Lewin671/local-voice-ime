name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Local Voice IME is a fork. Please report problems here, not to the fcitx5-android project.
        Never attach recordings or text you would not want to be public.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app under About.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice dictation (hold space)
        - Voice dictation (hands-free panel)
        - Recognition accuracy
        - Typing (pinyin / English)
        - Appearance
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For recognition problems, write what you said and what was inserted.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
